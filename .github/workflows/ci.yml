name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore Olga.Nlp.sln
      - run: dotnet build Olga.Nlp.sln --configuration Release --no-restore
      - run: dotnet test Olga.Nlp.sln --configuration Release --no-build
